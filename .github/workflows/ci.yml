
name: Distributed Rate Limiter CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build Docker image
        run: |
          docker build -t distributed-rate-limiter:1.2 .

      - name: Start application instances and Redis
        run: |
          docker compose up -d

      - name: Wait for application instances
        run: |
          for attempt in {1..30}; do
            if curl -fsS http://localhost:8080/actuator/health >/dev/null &&
               curl -fsS http://localhost:8081/actuator/health >/dev/null; then
              echo "Both application instances are healthy"
              exit 0
            fi

            echo "Waiting for applications..."
            sleep 2
          done

          echo "Applications failed to become healthy"
          docker compose ps
          exit 1

      - name: Prepare distributed integration test
        run: |
          docker exec rate-limiter-redis redis-cli DEL \
            rate_limit:USER:distributed-integration-test

          docker exec rate-limiter-redis redis-cli HSET \
            rate_policy:USER:distributed-integration-test \
            plan FREE capacity 5 refillRate 0.000001

      - name: Run automated tests
        run: |
          chmod +x mvnw
          ./mvnw -B clean test

      - name: Show application logs on failure
        if: failure()
        run: |
          docker compose logs --no-color

      - name: Stop containers
        if: always()
        run: |
          docker compose down -v
