
services:
  redis:
    image: redis:7-alpine
    container_name: rate-limiter-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app1:
    image: distributed-rate-limiter:1.2
    container_name: rate-limiter-app1
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      RATE_LIMITER_REDIS_FAILURE_STRATEGY: fail-open
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  app2:
    image: distributed-rate-limiter:1.2
    container_name: rate-limiter-app2
    ports:
      - "8081:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      RATE_LIMITER_REDIS_FAILURE_STRATEGY: fail-open
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
    driver: local
